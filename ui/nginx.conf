# nginx for the built UI — static assets plus a reverse proxy to the server.
#
# The proxy is not optional. `api.ts` picks its API base from the page's port:
# 5173/5174 means "Vite dev server, talk same-origin and let its proxy
# forward", anything else means "talk to :8000 directly". docker-compose
# publishes this container on host port 5173, so the browser takes the
# same-origin branch — and every API call, plus the /ws/scene WebSocket that
# carries the whole model, lands here instead of on the server. Without these
# blocks they all 404 and the UI sits at "reconnecting…" forever.
#
# Keeping it same-origin is also what keeps CORS out of the picture entirely.

upstream orbiter_server {
    server server:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Model + scene push. WebSockets need the upgrade dance and must never
    # time out on an idle connection — the hub can be quiet for minutes
    # between machine events.
    location /ws {
        proxy_pass http://orbiter_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Live MJPEG (phone camera) and the camserver JSON passthrough used by the
    # Stereo tab. Buffering must stay off: a multipart/x-mixed-replace body
    # never ends, so nginx would hold frames instead of streaming them.
    location /camera {
        proxy_pass http://orbiter_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    location /stereo {
        proxy_pass http://orbiter_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Plain JSON/file REST.
    location /scans {
        proxy_pass http://orbiter_server;
        proxy_set_header Host $host;
    }

    location /captures {
        proxy_pass http://orbiter_server;
        proxy_set_header Host $host;
    }

    location /config {
        proxy_pass http://orbiter_server;
        proxy_set_header Host $host;
    }

    # SPA fallback — every other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
